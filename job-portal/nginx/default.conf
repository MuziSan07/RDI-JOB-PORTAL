# nginx inside the frontend container: serves the React build, proxies API +
# media + SEO routes to the Django backend, and hands crawlers the server-rendered
# per-job pages.

# Bots / social scrapers that should get the server-rendered per-job HTML.
map $http_user_agent $rdi_is_crawler {
    default 0;
    "~*(GPTBot|ChatGPT-User|OAI-SearchBot|PerplexityBot|Perplexity-User|Google-Extended|GoogleOther|Applebot|ClaudeBot|anthropic-ai|Claude-Web|cohere-ai|CCBot|Amazonbot|Bytespider|Meta-ExternalAgent|YouBot|DuckAssistBot|Googlebot|bingbot|DuckDuckBot|YandexBot|Baiduspider|facebookexternalhit|Twitterbot|LinkedInBot|Slackbot|WhatsApp|Discordbot|TelegramBot)" 1;
}

upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow résumé / profile-picture / logo uploads.
    client_max_body_size 25M;

    # Headers passed to Django on every proxied location (inherited below).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Django-owned endpoints ────────────────────────────────────────────────
    location /api/           { proxy_pass http://django; }
    location = /sitemap.xml  { proxy_pass http://django; }
    location = /robots.txt   { proxy_pass http://django; }
    location /django-static/ { proxy_pass http://django; }

    # Uploaded files (profile pictures, résumés, department logos, employee
    # photos) served straight from the shared media volume.
    location /media/ {
        alias /media/;
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Per-job page: crawlers get server-rendered HTML from Django, humans get the
    # React SPA (which then fetches the job over the API).
    location ~ ^/jobs/.+ {
        if ($rdi_is_crawler) {
            proxy_pass http://django;
        }
        try_files $uri /index.html;
    }

    # Long-cache the hashed React build assets.
    location /static/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Everything else is the React SPA (client-side routing).
    location / {
        try_files $uri /index.html;
    }
}
