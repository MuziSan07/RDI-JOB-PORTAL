# nginx site for RDI Job Portal.
# Install to: /etc/nginx/sites-available/hr.rdi.world  then symlink into sites-enabled.
#
#   sudo cp deploy/nginx-hr.rdi.world.conf /etc/nginx/sites-available/hr.rdi.world
#   sudo ln -sf /etc/nginx/sites-available/hr.rdi.world /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is the plain HTTP (port 80) version. Running certbot afterwards
# (see DEPLOYMENT.md) rewrites it in place to add the HTTPS (443) server block
# and an automatic http -> https redirect.

# Bots and social/link scrapers that should receive the server-rendered per-job
# HTML (Open Graph + JobPosting JSON-LD) instead of the empty React shell.
map $http_user_agent $rdi_is_crawler {
    default 0;
    "~*(GPTBot|ChatGPT-User|OAI-SearchBot|PerplexityBot|Perplexity-User|Google-Extended|GoogleOther|Applebot|ClaudeBot|anthropic-ai|Claude-Web|cohere-ai|CCBot|Amazonbot|Bytespider|Meta-ExternalAgent|YouBot|DuckAssistBot|Googlebot|bingbot|DuckDuckBot|YandexBot|Baiduspider|facebookexternalhit|Twitterbot|LinkedInBot|Slackbot|WhatsApp|Discordbot|TelegramBot)" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name hr.rdi.world;

    # Built React app.
    root /var/www/rdi-job-portal/job-portal/frontend/build;
    index index.html;

    # Allow résumé / profile-picture / logo uploads.
    client_max_body_size 25M;

    # Headers passed to Django on every proxied location (inherited below).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Django-owned endpoints ────────────────────────────────────────────────
    location /api/          { proxy_pass http://127.0.0.1:8001; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8001; }
    location = /robots.txt  { proxy_pass http://127.0.0.1:8001; }

    # User uploads and Django's own static files, served straight from disk.
    location /media/ {
        alias /var/www/rdi-job-portal/backend/media/;
        access_log off;
        expires 7d;
    }
    location /django-static/ {
        alias /var/www/rdi-job-portal/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Per-job page: crawlers get server-rendered HTML from Django, humans get the
    # React SPA (which then fetches the job over the API).
    location ~ ^/jobs/.+ {
        if ($rdi_is_crawler) {
            proxy_pass http://127.0.0.1:8001;
        }
        try_files $uri /index.html;
    }

    # Long-cache the hashed React build assets.
    location /static/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Everything else is handled by the React app (client-side routing).
    location / {
        try_files $uri /index.html;
    }
}
